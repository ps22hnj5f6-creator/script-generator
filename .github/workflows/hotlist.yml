name: update-hotlist
on:
  schedule:
    - cron: "0 7 * * *"   # 北京时间 15:00（UTC+8）
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 拉取热榜
        run: python fetch_hotlist.py
      - name: 提交 hotlist.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 每日热榜更新"
          file_pattern: "hotlist.json"
